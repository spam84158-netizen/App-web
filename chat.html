<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI CHAT · Aldetic Frontiers</title>
<meta name="description" content="Aldetic Frontiers Ltd : Technology Beyond Limits.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body data-protected="true">
<div id="site-header"></div>
<section style="padding-top:32px;border:0">
  <div class="wrap">
    <p class="eyebrow" data-intro>AI CHAT</p>
    <h1 data-intro style="font-size:clamp(36px,4.6vw,54px)" data-en="Ask a question">Posez une question</h1>
  </div>
</section>
<section class="band" style="padding-top:28px">
  <div class="wrap" style="max-width:860px">
    <div class="panel" style="display:flex;flex-direction:column;min-height:420px;padding:0;overflow:hidden">
      <div style="padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
        <div class="field" style="margin:0;min-width:200px"><label for="model" style="font-size:13px" data-en="Model">Modèle</label><select id="model" disabled><option data-en="To be confirmed">À confirmer</option></select></div>
        <button class="btn small ghost" id="newchat" type="button" data-en="New chat">Nouveau chat</button>
      </div>
      <div id="msgs" style="flex:1;padding:20px;display:grid;gap:12px;align-content:start"><div class="empty" data-en="The assistant is not connected yet. No answer is generated until the service is set up.">L'assistant n'est pas encore connecté. Aucune réponse n'est générée tant que le service n'est pas configuré.</div></div>
      <form id="chatf" style="display:flex;gap:10px;padding:14px;border-top:1px solid var(--rule)">
        <label for="ci" class="muted" style="position:absolute;left:-9999px" data-en="Your message">Votre message</label>
        <input id="ci" placeholder="Votre question…" data-ph-en="Your question…" disabled style="flex:1">
        <button class="btn" type="submit" disabled data-en="Send">Envoyer</button>
      </form>
    </div>
    <p class="muted" style="font-size:14px;margin-top:14px" data-en="Usage limits and the list of models will be displayed here once confirmed.">Les limites d'utilisation et la liste des modèles seront affichées ici une fois confirmées.</p>
  </div>
</section>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n-es.js"></script>
<script src="assets/js/i18n-ar.js"></script>
<script src="assets/js/i18n-zh.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ask-ai.js"></script>
</body>
</html>
