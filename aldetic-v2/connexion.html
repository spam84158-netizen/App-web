<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion · Aldetic Frontiers</title>
<meta name="description" content="Aldetic Frontiers Ltd : Technology Beyond Limits.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body data-protected="false">
<div id="site-header"></div>
<section style="padding-top:clamp(64px,9vw,112px);border:0">
  <div class="wrap" style="max-width:440px">
    <p class="eyebrow" data-intro data-en="Account">Compte</p>
    <h1 data-intro style="font-size:clamp(40px,5vw,56px)" data-en="Log in">Connexion</h1>
    <form id="auth-form" data-mode="login" style="margin-top:32px" novalidate>
      <div class="field"><label for="em" data-en="Email">E-mail</label><input id="em" name="email" type="email" required autocomplete="email"></div>
      <div class="field"><label for="pw" data-en="Password">Mot de passe</label><input id="pw" name="password" type="password" required minlength="8" autocomplete="current-password"></div>
      <button class="btn" type="submit" style="width:100%" data-en="Log in">Se connecter</button>
    </form>
<button class="btn ghost" type="button" data-oauth="google" style="width:100%;margin-top:12px" data-en="Continue with Google">Continuer avec Google</button>
    <p id="auth-msg" class="notice warn" hidden style="margin-top:16px"></p>
    <p class="muted" style="margin-top:24px;font-size:15px"><span data-en="No account yet?">Pas encore de compte ?</span> <a href="inscription.html" style="color:var(--cobalt)" data-en="Sign up">Inscription</a></p>
  </div>
</section>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/i18n-en.js"></script>
<script src="assets/js/i18n-es.js"></script>
<script src="assets/js/i18n-ar.js"></script>
<script src="assets/js/i18n-zh.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/ask-ai.js"></script>
</body>
</html>
